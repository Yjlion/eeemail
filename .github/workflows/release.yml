name: Release

on:
  push:
    tags: ["v*"]
  # Buildable on demand, so a release can be rehearsed without cutting a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (leave empty to build the current ref)"
        required: false
        type: string

permissions:
  contents: write

env:
  # Keep in sync with ci.yml.
  RUST_VERSION: 1.97.1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      # One platform failing must not cancel the other: a partial release is
      # easier to complete than to reconstruct.
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      # eeemail links SQLCipher and OpenSSL through vendored crates, so there
      # is no system OpenSSL to find on either platform. Only the Linux webview
      # has to be installed, and only for the desktop shell.
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libgtk-3-dev librsvg2-dev patchelf

      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - run: rustup toolchain install $RUST_VERSION --profile minimal --target ${{ matrix.target }}
        shell: bash
      - run: rustup override set $RUST_VERSION
        shell: bash

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # `tauri build` runs `npm run build` itself, so this is here for `npm ci`
      # and for the `tsc --noEmit` inside it: a type error should stop a release
      # before it spends twenty minutes compiling the engine.
      - name: Install and check the frontend
        working-directory: desktop
        run: |
          npm ci
          npm run build

      # The two headless binaries. The desktop app is built by `tauri build`
      # below instead, because `cargo build` produces an executable and this
      # release has to produce something a launcher can install.
      - name: Build the headless binaries
        working-directory: core
        run: cargo build --release --locked --target ${{ matrix.target }} -p eeemail-cli -p deltachat-rpc-server

      # Installers, not a loose executable: a .deb or an .AppImage registers a
      # desktop entry and an icon, which is what makes eeemail something you
      # launch rather than something you remember the path to.
      #
      # `--bundles` per platform rather than the config's list, so a Linux
      # runner without rpm tooling cannot fail a release over a bundle nobody
      # asked for.
      - name: Build the desktop app
        working-directory: desktop
        env:
          # `linuxdeploy`, which the AppImage bundler drives, is itself an
          # AppImage and needs FUSE2 to mount itself. `ubuntu-latest` is 24.04,
          # which no longer ships libfuse2, so without this the AppImage target
          # fails on a runner that has nothing to do with our code. Extracting
          # instead of mounting is the documented way out and costs a little
          # disk. Harmless on Windows, where nothing reads it.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # v0.3.0 shipped an app whose ACL compiled to `{}`, so `listen()` was
      # refused and the frontend never received an engine event.
      # `test_the_frontend_is_allowed_to_hear_the_engine` in
      # `desktop/src-tauri/src/main.rs` is the real guard and it runs in CI;
      # this repeats the check here because the
      # release workflow runs no tests at all, and because the generated file is
      # what the shipped binary embeds.
      - name: The event stream is granted
        shell: bash
        run: |
          acl=desktop/src-tauri/gen/schemas/capabilities.json
          if ! grep -q "core:event" "$acl"; then
            echo "the Tauri ACL grants no event permission; this build is unusable" >&2
            cat "$acl" >&2
            exit 1
          fi

      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          out="eeemail-${{ matrix.name }}"
          mkdir -p "dist/$out"
          bin="core/target/${{ matrix.target }}/release"
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi

          # All three binaries, the app first. Through v0.3.0 this archive held
          # only the two tools, and the app shipped as an installer alone --
          # which meant there was no way to run eeemail without installing it,
          # and so no way to try it, or to reproduce a bug in it, on a machine
          # you would rather not install onto. See
          # docs/adr/0024-portable-archives.md.
          #
          # `tauri build` renames cargo's `eeemail-desktop` to `mainBinaryName`
          # after compiling, so `eeemail$suffix` is already sitting beside the
          # tools and nothing extra has to be built for this.
          for program in eeemail eeemail-cli deltachat-rpc-server; do
            cp "$bin/$program$suffix" "dist/$out/"
          done
          cp LICENSE NOTICE README.md docs/INSTALL.md docs/PORTABLE.md "dist/$out/"

          # The marker that moves the profile into this folder. It ships here
          # and nowhere else, so the same executable is portable when it was
          # unzipped and ordinary when it was installed, and the two cannot
          # meet on one machine.
          touch "dist/$out/eeemail-portable"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp scripts/eeemail.cmd "dist/$out/"

            # The one thing a Windows portable build cannot do without:
            # eeemail is a WebView2 app and only the NSIS installer bootstraps
            # the runtime. `eeemail.cmd` installs this if the runtime is
            # missing, then launches the app.
            #
            # This is the second unpinned third-party download on the Windows
            # leg -- docs/handoff.md records the v0.3.0 tag build failing on
            # the first (`nsis-3.zip: Connection Failed`) and calls it a coin
            # flip. The Evergreen bootstrapper is versionless by design and so
            # cannot be hash-pinned; retrying, and failing with the URL in the
            # message, is the whole of the mitigation available.
            url="https://go.microsoft.com/fwlink/p/?LinkId=2124703"
            webview2="dist/$out/MicrosoftEdgeWebview2Setup.exe"
            for attempt in 1 2 3; do
              if curl -fsSL --retry 3 --retry-delay 5 -o "$webview2" "$url"; then
                break
              fi
              echo "attempt $attempt of 3 failed: $url" >&2
              if [ "$attempt" = 3 ]; then
                echo "cannot fetch the WebView2 bootstrapper from $url" >&2
                exit 1
              fi
              sleep 15
            done
            # fwlink can answer 200 with an error page, which curl will not
            # notice. The bootstrapper is around 1.5 MB and starts with `MZ`.
            if [ "$(wc -c < "$webview2")" -lt 100000 ] || [ "$(head -c 2 "$webview2")" != "MZ" ]; then
              echo "what came back from $url is not a Windows executable" >&2
              exit 1
            fi
          fi

          ( cd dist
            if [ "${{ runner.os }}" = "Windows" ]; then
              7z a "$out.zip" "$out"
            else
              # `zip`, not `7z`: ubuntu-latest ships the former, not the latter.
              zip -qr "$out.zip" "$out"
            fi )

          # Installers, flattened out of Tauri's per-format directories so the
          # release page lists files rather than paths. The WebView2
          # bootstrapper the NSIS bundler embeds lands under `bundle/` too, and
          # is Microsoft's to publish rather than ours.
          bundle="$bin/bundle"
          find "$bundle" -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' \) \
            -not -name 'MicrosoftEdgeWebview2Setup.exe' \
            -exec cp {} dist/ \;
          ls -la dist

      # A checksum per archive, so a download can be verified without trusting
      # the transport it arrived over.
      - name: Checksum
        shell: bash
        working-directory: dist
        run: |
          for f in *.zip *.deb *.AppImage *.exe *.msi; do
            [ -e "$f" ] || continue
            if command -v sha256sum >/dev/null; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: eeemail-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.deb
            dist/*.AppImage
            dist/*.exe
            dist/*.msi
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Only a tag push publishes. A manual run builds and uploads artifacts so
    # the release can be rehearsed without creating one.
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "eeemail ${GITHUB_REF_NAME}" \
            --notes-file .github/RELEASE_NOTES.md \
            --prerelease \
            dist/*
