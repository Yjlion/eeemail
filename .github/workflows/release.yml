name: Release

# Every push to main builds the release artefacts. Pushing a `v*` tag then
# publishes the artefacts already built for that commit, once CI has passed on
# it, so a release no longer means tagging and then waiting forty minutes. See
# docs/adr/0031-release-artifacts-built-on-main.md.
on:
  push:
    branches: [main]
    tags: ["v*"]
  # Buildable on demand, so a release can be rehearsed without cutting a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (leave empty to build the current ref)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to main supersedes an older prebuild. A tag is never
  # cancelled; if the prebuild it was waiting for is, it builds for itself.
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions: {}

env:
  # Keep in sync with ci.yml.
  RUST_VERSION: 1.97.1
  # core/Cargo.toml's fat LTO stays. Thin LTO with 16 codegen units was tried in
  # the rehearsal for ADR 0031: cold, it was no faster (Windows tools 22 min
  # against 20), and the archives grew by a third. What this workflow saves
  # comes from parallel legs and main's warm cache, not from the profile.

jobs:
  # Tags only: find main's prebuild of this exact commit, waiting for it if it
  # is still running. An empty `run_id` means there is nothing usable to reuse
  # and `build` runs here instead.
  reuse:
    name: Find the prebuild
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 75 * 60))
          while :; do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml \
              --branch main --event push --commit "$GITHUB_SHA" --limit 1 \
              --json databaseId,status,conclusion,url --jq '.[0] // empty')
            if [ -z "$run" ]; then
              echo "no prebuild of $GITHUB_SHA on main; building here"
              echo "run_id=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            id=$(jq -r .databaseId <<<"$run")
            status=$(jq -r .status <<<"$run")
            conclusion=$(jq -r .conclusion <<<"$run")
            if [ "$status" = completed ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "prebuild $(jq -r .url <<<"$run") is still running after 75 minutes; building here"
              echo "run_id=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "prebuild $(jq -r .url <<<"$run") is $status; waiting"
            sleep 30
          done
          # Artefacts expire. Reuse only a run whose packages are all still there.
          packages=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
            --jq '[.artifacts[] | select(.expired | not) | select(.name | startswith("eeemail-"))] | length')
          if [ "$conclusion" = success ] && [ "$packages" = 2 ]; then
            echo "reusing prebuild $(jq -r .url <<<"$run")"
            echo "run_id=$id" >> "$GITHUB_OUTPUT"
          else
            echo "prebuild $(jq -r .url <<<"$run") is $conclusion with $packages packages; building here"
            echo "run_id=" >> "$GITHUB_OUTPUT"
          fi

  # The desktop app and the two headless binaries are separate cargo
  # invocations that unify features differently, so `deltachat` was compiled
  # twice, one after the other, in each leg. As separate jobs they compile in
  # parallel instead.
  build:
    name: ${{ matrix.platform.name }} ${{ matrix.role }}
    needs: reuse
    if: >-
      !cancelled() &&
      (github.ref_type != 'tag' || (needs.reuse.result == 'success' && needs.reuse.outputs.run_id == ''))
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      # One platform failing must not cancel the other: a partial release is
      # easier to complete than to reconstruct.
      fail-fast: false
      matrix:
        platform:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
        role: [app, tools]
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      # eeemail links SQLCipher and OpenSSL through vendored crates, so there
      # is no system OpenSSL to find on either platform. Only the Linux webview
      # has to be installed, and only for the desktop shell.
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux' && matrix.role == 'app'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libgtk-3-dev librsvg2-dev patchelf

      - name: Install NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - run: rustup toolchain install $RUST_VERSION --profile minimal --target ${{ matrix.platform.target }}
        shell: bash
      - run: rustup override set $RUST_VERSION
        shell: bash

      # Saved from main only. A tag can restore the default branch's caches but
      # not another tag's, so a cache saved under a tag was never read again.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: ${{ matrix.platform.target }}-${{ matrix.role }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # The two headless binaries. The desktop app is built by `tauri build`
      # instead, because `cargo build` produces an executable and this release
      # has to produce something a launcher can install.
      - name: Build the headless binaries
        if: matrix.role == 'tools'
        working-directory: core
        run: cargo build --release --locked --target ${{ matrix.platform.target }} -p eeemail-cli -p deltachat-rpc-server

      - uses: actions/setup-node@v4
        if: matrix.role == 'app'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # `tauri build` runs `npm run build` itself, so this is here for `npm ci`
      # and for the `tsc --noEmit` inside it: a type error should stop a release
      # before it spends twenty minutes compiling the engine.
      - name: Install and check the frontend
        if: matrix.role == 'app'
        working-directory: desktop
        run: |
          npm ci
          npm run build

      # Installers, not a loose executable: a .deb or an .AppImage registers a
      # desktop entry and an icon, which is what makes eeemail something you
      # launch rather than something you remember the path to.
      #
      # `--bundles` per platform rather than the config's list, so a Linux
      # runner without rpm tooling cannot fail a release over a bundle nobody
      # asked for.
      - name: Build the desktop app
        if: matrix.role == 'app'
        working-directory: desktop
        env:
          # `linuxdeploy`, which the AppImage bundler drives, is itself an
          # AppImage and needs FUSE2 to mount itself. `ubuntu-latest` is 24.04,
          # which no longer ships libfuse2, so without this the AppImage target
          # fails on a runner that has nothing to do with our code. Extracting
          # instead of mounting is the documented way out and costs a little
          # disk. Harmless on Windows, where nothing reads it.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npm run tauri build -- --target ${{ matrix.platform.target }} --bundles ${{ matrix.platform.bundles }}

      # v0.3.0 shipped an app whose ACL compiled to `{}`, so `listen()` was
      # refused and the frontend never received an engine event.
      # `test_the_frontend_is_allowed_to_hear_the_engine` in
      # `desktop/src-tauri/src/main.rs` is the real guard and it runs in CI;
      # this repeats the check here because the
      # release workflow runs no tests at all, and because the generated file is
      # what the shipped binary embeds.
      - name: The event stream is granted
        if: matrix.role == 'app'
        shell: bash
        run: |
          acl=desktop/src-tauri/gen/schemas/capabilities.json
          if ! grep -q "core:event" "$acl"; then
            echo "the Tauri ACL grants no event permission; this build is unusable" >&2
            cat "$acl" >&2
            exit 1
          fi

      # What `package` needs from this leg, and nothing else. `tauri build`
      # renames cargo's `eeemail-desktop` to `mainBinaryName` after compiling,
      # so the app is `eeemail`.
      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          bin="core/target/${{ matrix.platform.target }}/release"
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          mkdir -p out
          if [ "${{ matrix.role }}" = app ]; then
            mkdir -p out/installers
            cp "$bin/eeemail$suffix" out/
            # Installers, flattened out of Tauri's per-format directories so
            # the release page lists files rather than paths. The WebView2
            # bootstrapper the NSIS bundler embeds lands under `bundle/` too,
            # and is Microsoft's to publish rather than ours.
            find "$bin/bundle" -type f \
              \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' \) \
              -not -name 'MicrosoftEdgeWebview2Setup.exe' \
              -exec cp {} out/installers/ \;
          else
            cp "$bin/eeemail-cli$suffix" "$bin/deltachat-rpc-server$suffix" out/
          fi
          ls -laR out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.role }}-${{ matrix.platform.name }}
          path: out/
          if-no-files-found: error
          # Intermediate: `package` turns these into what is published.
          retention-days: 3

  package:
    name: Package ${{ matrix.name }}
    needs: build
    # Per platform, so a Linux package still gets made when Windows failed.
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            suffix: ""
          - name: windows-amd64
            suffix: .exe
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: app
      - uses: actions/download-artifact@v4
        with:
          name: tools-${{ matrix.name }}
          path: tools

      - name: Stage artifacts
        run: |
          set -euo pipefail
          out="eeemail-${{ matrix.name }}"
          suffix="${{ matrix.suffix }}"
          mkdir -p "dist/$out"

          # All three binaries, the app first. Through v0.3.0 this archive held
          # only the two tools, and the app shipped as an installer alone --
          # which meant there was no way to run eeemail without installing it,
          # and so no way to try it, or to reproduce a bug in it, on a machine
          # you would rather not install onto. See
          # docs/adr/0024-portable-archives.md.
          cp "app/eeemail$suffix" "dist/$out/"
          cp "tools/eeemail-cli$suffix" "tools/deltachat-rpc-server$suffix" "dist/$out/"
          # Artefact upload does not keep the executable bit, and a portable
          # Linux archive whose programs will not run is not portable.
          if [ -z "$suffix" ]; then
            chmod +x "dist/$out/eeemail" "dist/$out/eeemail-cli" "dist/$out/deltachat-rpc-server"
          fi
          cp LICENSE NOTICE README.md docs/INSTALL.md docs/PORTABLE.md "dist/$out/"

          # The marker that moves the profile into this folder. It ships here
          # and nowhere else, so the same executable is portable when it was
          # unzipped and ordinary when it was installed, and the two cannot
          # meet on one machine.
          touch "dist/$out/eeemail-portable"

          if [ "${{ matrix.name }}" = windows-amd64 ]; then
            cp scripts/eeemail.cmd "dist/$out/"

            # The one thing a Windows portable build cannot do without:
            # eeemail is a WebView2 app and only the NSIS installer bootstraps
            # the runtime. `eeemail.cmd` installs this if the runtime is
            # missing, then launches the app.
            #
            # This is the second unpinned third-party download on the Windows
            # leg -- docs/handoff.md records the v0.3.0 tag build failing on
            # the first (`nsis-3.zip: Connection Failed`) and calls it a coin
            # flip. The Evergreen bootstrapper is versionless by design and so
            # cannot be hash-pinned; retrying, and failing with the URL in the
            # message, is the whole of the mitigation available.
            url="https://go.microsoft.com/fwlink/p/?LinkId=2124703"
            webview2="dist/$out/MicrosoftEdgeWebview2Setup.exe"
            for attempt in 1 2 3; do
              if curl -fsSL --retry 3 --retry-delay 5 -o "$webview2" "$url"; then
                break
              fi
              echo "attempt $attempt of 3 failed: $url" >&2
              if [ "$attempt" = 3 ]; then
                echo "cannot fetch the WebView2 bootstrapper from $url" >&2
                exit 1
              fi
              sleep 15
            done
            # fwlink can answer 200 with an error page, which curl will not
            # notice. The bootstrapper is around 1.5 MB and starts with `MZ`.
            if [ "$(wc -c < "$webview2")" -lt 100000 ] || [ "$(head -c 2 "$webview2")" != "MZ" ]; then
              echo "what came back from $url is not a Windows executable" >&2
              exit 1
            fi
          fi

          ( cd dist && zip -qr "$out.zip" "$out" )
          cp app/installers/* dist/
          ls -la dist

      # A checksum per archive, so a download can be verified without trusting
      # the transport it arrived over.
      - name: Checksum
        working-directory: dist
        run: |
          for f in *.zip *.deb *.AppImage *.exe *.msi; do
            [ -e "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: eeemail-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.deb
            dist/*.AppImage
            dist/*.exe
            dist/*.msi
            dist/*.sha256
          if-no-files-found: error

  # Tags only: a release is published only from a commit CI passed on. This was
  # a rule the person tagging had to remember; now the workflow waits for it,
  # so the tag can go on the moment the release PR is merged.
  gate:
    name: CI passed on this commit
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deadline=$((SECONDS + 60 * 60))
          while :; do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --event push --commit "$GITHUB_SHA" --limit 1 \
              --json status,conclusion,url --jq '.[0] // empty')
            if [ -z "$run" ]; then
              # CI starts within seconds of a push to main. Nothing after ten
              # minutes means this commit was never pushed to main.
              if [ "$SECONDS" -ge 600 ]; then
                echo "no CI run on main for $GITHUB_SHA; tag a commit that is on main" >&2
                exit 1
              fi
              echo "no CI run for $GITHUB_SHA yet; waiting"
            elif [ "$(jq -r .status <<<"$run")" = completed ]; then
              conclusion=$(jq -r .conclusion <<<"$run")
              if [ "$conclusion" = success ]; then
                echo "CI passed: $(jq -r .url <<<"$run")"
                exit 0
              fi
              echo "CI is $conclusion on $GITHUB_SHA: $(jq -r .url <<<"$run")" >&2
              echo "fix or re-run it, then re-run this workflow's failed jobs" >&2
              exit 1
            else
              echo "CI $(jq -r .url <<<"$run") is $(jq -r .status <<<"$run"); waiting"
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "CI has not finished after an hour" >&2
              exit 1
            fi
            sleep 30
          done

  release:
    name: Publish release
    needs: [reuse, package, gate]
    if: >-
      !cancelled() && github.ref_type == 'tag' && needs.gate.result == 'success' &&
      (needs.package.result == 'success' ||
       (needs.package.result == 'skipped' && needs.reuse.outputs.run_id != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: eeemail-*
          path: dist
          merge-multiple: true
          run-id: ${{ needs.reuse.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "eeemail ${GITHUB_REF_NAME}" \
            --notes-file .github/RELEASE_NOTES.md \
            --prerelease \
            dist/*
