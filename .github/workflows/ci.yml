name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

env:
  RUSTFLAGS: -Dwarnings
  # Keep in sync with core/.github/workflows/ci.yml so our fork is linted the
  # same way upstream lints itself; a version skew shows up as phantom
  # clippy/rustfmt diffs on every upstream merge.
  RUST_VERSION: 1.97.1
  MSRV: 1.89.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
      - run: rustup toolchain install $RUST_VERSION --profile minimal --component rustfmt --component clippy
      - run: rustup override set $RUST_VERSION
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: rustfmt
        working-directory: core
        run: cargo fmt --all -- --check
      # Both configurations. --all-features alone would never lint the
      # default (gated-off) build, which is the one we actually ship, and
      # dead-code warnings only appear when a feature is OFF.
      - name: clippy (default features)
        working-directory: core
        run: cargo clippy --workspace --all-targets
      - name: clippy (all features)
        working-directory: core
        run: cargo clippy --workspace --all-targets --all-features

  fork-discipline:
    name: Fork discipline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
          fetch-depth: 0
      - name: Every patched upstream file must be in the ledger
        run: ./scripts/check-fork-patches.sh

  mail-server:
    name: Test mail server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
      - name: Build image
        run: docker build -t eeemail/test-mail:latest server/compose
      - name: Permissive profile
        run: |
          docker run -d --name mail --hostname eeemail.test \
            -p 2525:25 -p 2587:587 -p 2465:465 -p 2143:143 -p 2993:993 \
            eeemail/test-mail:latest
          timeout 60 bash -c 'until docker logs mail 2>&1 | grep -q "ready"; do sleep 1; done'
          python3 server/compose/smoke-test.py
          docker rm -f mail
      - name: Strict profile
        run: |
          docker run -d --name mail --hostname eeemail.test -e STRICT_E2EE=1 \
            -p 2525:25 -p 2587:587 -p 2465:465 -p 2143:143 -p 2993:993 \
            eeemail/test-mail:latest
          timeout 60 bash -c 'until docker logs mail 2>&1 | grep -q "ready"; do sleep 1; done'
          python3 server/compose/smoke-test.py --strict
          docker rm -f mail

  msrv:
    name: MSRV ${{ github.workflow }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
      - run: rustup toolchain install $MSRV --profile minimal
      - run: rustup override set $MSRV
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: cargo check
        working-directory: core
        run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
      - run: rustup toolchain install $RUST_VERSION --profile minimal
      - run: rustup override set $RUST_VERSION
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # nextest, not `cargo test`: deltachat-time mocks the clock via a
      # process-global static whose shift accumulates, so a single-process run
      # fails on a green tree. nextest isolates each test in its own process.
      # See docs/testing.md.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: cargo nextest (default features)
        working-directory: core
        run: cargo nextest run --workspace --locked
      - name: cargo nextest (all features)
        working-directory: core
        run: cargo nextest run --workspace --locked --all-features
      - name: doctests
        working-directory: core
        run: cargo test --workspace --locked --doc
