name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

env:
  RUSTFLAGS: -Dwarnings
  # Keep in sync with core/.github/workflows/ci.yml so our fork is linted the
  # same way upstream lints itself; a version skew shows up as phantom
  # clippy/rustfmt diffs on every upstream merge.
  RUST_VERSION: 1.97.1
  MSRV: 1.89.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
      # The workspace now includes the Tauri shell, so linting it needs the
      # Linux webview headers. Without these the build fails in `webkit2gtk`'s
      # build script, which is a confusing place to discover a missing package.
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libgtk-3-dev librsvg2-dev patchelf
      - run: rustup toolchain install $RUST_VERSION --profile minimal --component rustfmt --component clippy
      - run: rustup override set $RUST_VERSION
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build the frontend
        working-directory: desktop
        run: |
          npm ci
          npm run build
      - name: rustfmt
        working-directory: core
        run: cargo fmt --all -- --check
      # Both configurations. --all-features alone would never lint the
      # default (gated-off) build, which is the one we actually ship, and
      # dead-code warnings only appear when a feature is OFF.
      - name: clippy (default features)
        working-directory: core
        run: cargo clippy --workspace --all-targets
      - name: clippy (all features)
        working-directory: core
        run: cargo clippy --workspace --all-targets --all-features

  frontend:
    name: Desktop frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Typecheck
        working-directory: desktop
        run: npm run check
      - name: Build
        working-directory: desktop
        run: npm run build
      # The reading pane renders mail from strangers. These two properties are
      # what stand between a message and the network, and between message
      # markup and the app document; a refactor must not quietly drop either.
      # See docs/adr/0013-desktop-ui.md.
      - name: Untrusted content stays contained
        working-directory: desktop
        run: |
          grep -q "Content-Security-Policy" dist/index.html
          grep -q "default-src 'self'" dist/index.html
          grep -q "sandbox" dist/assets/*.js
          if grep -q "allow-scripts\|allow-same-origin" dist/assets/*.js; then
            echo "message HTML must never be granted scripts or a real origin" >&2
            exit 1
          fi

  fork-discipline:
    name: Fork discipline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
          fetch-depth: 0
      - name: Every patched upstream file must be in the ledger
        run: ./scripts/check-fork-patches.sh

  mail-server:
    name: Test mail server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
      - name: Build image
        run: docker build -t eeemail/test-mail:latest server/compose
      - name: Permissive profile
        run: |
          docker run -d --name mail --hostname eeemail.test \
            -p 2525:25 -p 2587:587 -p 2465:465 -p 2143:143 -p 2993:993 \
            eeemail/test-mail:latest
          timeout 60 bash -c 'until docker logs mail 2>&1 | grep -q "ready"; do sleep 1; done'
          python3 server/compose/smoke-test.py
          docker rm -f mail
      - name: Strict profile
        run: |
          docker run -d --name mail --hostname eeemail.test -e STRICT_E2EE=1 \
            -p 2525:25 -p 2587:587 -p 2465:465 -p 2143:143 -p 2993:993 \
            eeemail/test-mail:latest
          timeout 60 bash -c 'until docker logs mail 2>&1 | grep -q "ready"; do sleep 1; done'
          python3 server/compose/smoke-test.py --strict
          docker rm -f mail

  msrv:
    name: MSRV ${{ github.workflow }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libgtk-3-dev librsvg2-dev patchelf
      - run: rustup toolchain install $MSRV --profile minimal
      - run: rustup override set $MSRV
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # The Tauri shell needs the built frontend to exist at compile time:
      # `tauri::generate_context!` reads `frontendDist`.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the frontend
        working-directory: desktop
        run: |
          npm ci
          npm run build
      - name: cargo check
        working-directory: core
        run: cargo check --workspace --all-targets

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
      # eeemail links SQLCipher and OpenSSL through vendored crates, which is
      # what needs an assembler here.
      - name: Install NASM
        uses: ilammy/setup-nasm@v1
      - run: rustup toolchain install $RUST_VERSION --profile minimal
        shell: bash
      - run: rustup override set $RUST_VERSION
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: windows
      # `tauri::generate_context!` reads `frontendDist` at compile time.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build the frontend
        working-directory: desktop
        run: |
          npm ci
          npm run build
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # The release matrix has built Windows since Phase 7 and has never *run*
      # anything on it, which is the structural reason `accounts_dir()` could be
      # wrong for eight releases and the desktop ACL could be empty for one.
      #
      # eeemail's own crates only, not `--workspace`: upstream's Windows
      # portability is upstream's, and pulling `fuzz` and `deltachat-ffi` onto a
      # Windows runner buys nothing here and can fail for reasons that have
      # nothing to do with this fork. `deltachat` is still compiled, as their
      # dependency.
      - name: cargo check
        working-directory: core
        run: cargo check -p eeemail-desktop -p eeemail-cli --all-targets --locked
      # `data_dir()` is the function that was wrong on Windows, and
      # `test_the_frontend_is_allowed_to_hear_the_engine` is the ACL that made
      # v0.3.0 unusable. Both run here, on the platform that was never tested.
      - name: cargo nextest (desktop shell)
        working-directory: core
        run: cargo nextest run -p eeemail-desktop --locked

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libgtk-3-dev librsvg2-dev patchelf
      - run: rustup toolchain install $RUST_VERSION --profile minimal
      - run: rustup override set $RUST_VERSION
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # nextest, not `cargo test`: deltachat-time mocks the clock via a
      # process-global static whose shift accumulates, so a single-process run
      # fails on a green tree. nextest isolates each test in its own process.
      # See docs/testing.md.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: cargo nextest (default features)
        working-directory: core
        run: cargo nextest run --workspace --locked
      - name: cargo nextest (all features)
        working-directory: core
        run: cargo nextest run --workspace --locked --all-features
      - name: doctests
        working-directory: core
        run: cargo test --workspace --locked --doc
