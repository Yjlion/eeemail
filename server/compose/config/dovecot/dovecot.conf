## eeemail test server -- Dovecot
##
## Adapted from chatmail/relay's dovecot.conf.j2 (MIT). Differences from
## upstream, all deliberate (docs/adr/0007-server-template.md):
##
##   - passdb/userdb are passwd-file, not the doveauth dict. eeemail uses
##     traditional user@domain accounts; there is no create-on-login.
##   - No push_notification lua driver (that forwards to a third-party service).
##   - No last_login dict, no chatmail quota-expire script, no XCHATMAIL /
##     XDELTAPUSH capabilities -- all chatmail-relay specific.
##   - mail_attribute_dict is a local file rather than the chatmail-metadata
##     socket. IMAP METADATA is kept because core's calls.rs reads STUN/TURN
##     ICE servers from it.
##   - ssl = required is relaxed to "yes" so tests can use plaintext IMAP on
##     143 without wrestling a self-signed cert. Production must use `required`.

protocols = imap lmtp

# Listen on all interfaces inside the container.
listen = *

auth_mechanisms = plain login
auth_username_chars = abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ01234567890.-_@

# Traditional accounts, provisioned from server/compose/accounts.
passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/vmail/%u
}

mail_location = maildir:/var/vmail/%u/Maildir
mail_uid = vmail
mail_gid = vmail
mail_privileged_group = vmail

namespace inbox {
  inbox = yes
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Junk {
    special_use = \Junk
  }
  mailbox Trash {
    special_use = \Trash
  }
  mailbox Sent {
    special_use = \Sent
  }
}

# IMAP METADATA (RFC 5464). Kept so ICE/STUN servers can be advertised to
# clients the way core's calls.rs expects.
mail_attribute_dict = file:/var/vmail/%u/dovecot-attributes

mail_plugins = quota

protocol imap {
  mail_plugins = $mail_plugins imap_quota
  imap_metadata = yes
}

protocol lmtp {
  # Delivered mail is not fsynced: this is a disposable test spool.
  mail_fsync = never
}
lmtp_add_received_header = no

plugin {
  quota = maildir:User quota
  quota_rule = *:storage=100M
  quota_grace = 0
}

service lmtp {
  user = vmail
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode  = 0600
    user  = postfix
    group = postfix
  }
}

# Postfix submission authenticates against Dovecot over this socket.
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode  = 0660
    user  = postfix
    group = postfix
  }
}
# Left at the default (root, dropping privileges per-lookup) so it can read
# the passwd-file. Upstream runs this as vmail, which works there because
# their passdb is a socket rather than a file.

ssl = yes
ssl_cert = </etc/dovecot/ssl/cert.pem
ssl_key  = </etc/dovecot/ssl/key.pem
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes

log_path = /dev/stderr
info_log_path = /dev/stderr
